name: release

# Every push to main is released when it holds a fix, feature or breaking change: the checks pass, the pushed commits
# follow Conventional Commits, then scripts/release.mjs tags the pushed commit vx.y.z, without a commit to main, the
# tag is pushed with a GitHub release, and the packages are published to npm and the images to GitHub's registry at the
# tag's version, which scripts/stamp-version.mjs writes into the package.json files in the runner. Run by hand
# without a tag, it releases main's head as a push does: a push made with GITHUB_TOKEN, such as an auto-merge, starts
# no workflow, but a dispatch always does. Run by hand with a tag, it publishes the packages at that existing tag,
# skipping versions npm already has, and the images, to repeat a missed publish. The checks run the Postgres suite in
# full on every release of main. See docs/website/src/content/docs/reference/versioning.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          An existing release tag to publish again to npm and GitHub's registry, e.g. v0.1.0. Empty releases main's
          head, as a push to main does.
        required: false
        default: ''

# Plan, pack and the checks of every run start at once. From the tag onward each job has a concurrency group of its
# own, so one run at a time cuts a tag, publishes, builds an image or bumps, while another run's earlier jobs go on
# beside it. GitHub starts a group's jobs in the order they began to wait, and queue: max keeps every one waiting
# instead of cancelling all but the newest, so no run that cut a tag misses its publish. A run's job waits only once
# the same run's previous job ended, and that job ran after the older run's, so every stage keeps the order of the
# tags: a newer run reads the tags after the older run pushed its own, and npm and the registry get the releases
# oldest first.
jobs:
  # The tag this push would cut (scripts/release.mjs --dry-run prints it), or none, so the pack job can start at once.
  # A run by hand without a tag is a release of main's head, so it runs every job a push does, and only from main.
  plan:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Check that a release by hand runs from main
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::A release without a tag runs from main, not $REF"
          exit 1
      - run: bun install --frozen-lockfile
      - name: Find the tag the push would cut
        id: plan
        # The tag is assigned before it is written, so a release the features rule refuses fails this step.
        run: |
          tag=$(bun run release --dry-run --features-release-rule)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  # The packages, built and packed at the version plan predicts beside the checks, as none of it needs their result, or
  # at the tag a run by hand names; publish only uploads them, after checking that release cut the same version. It runs
  # without the identity token npm's trusted publishing needs, which only publish holds.
  pack:
    needs: plan
    if: ${{ !cancelled() && (inputs.tag || needs.plan.outputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Stamp the version into the packages
        env:
          TAG: ${{ inputs.tag || needs.plan.outputs.tag }}
        run: bun scripts/stamp-version.mjs "$TAG"
      - name: Build and pack the packages
        run: node scripts/publish.mjs --pack --out "$RUNNER_TEMP/packages"
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages
          if-no-files-found: error
          retention-days: 1

  # The checks start at once, without plan's answer, so they run the Postgres suite in full, as the last fail-safe, on
  # every push, whether or not it cuts a release.
  check:
    if: ${{ !inputs.tag }}
    uses: ./.github/workflows/ci.yml
    with:
      postgres: true

  commits:
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Lint the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        # A force-push's before is not an ancestor of the pushed commit and may be on no branch the clone has, so it is
        # fetched by its hash, and the push added only the commits that neither before nor a release tag holds: a push
        # that restores released history adds none. Without before, the pushed commit is linted alone. A run by hand has
        # no before, so it lints as a push would: the commits since the head the previous release run linted
        # (scripts/release-lint), so a malformed commit already on main fails one release, not every later one; without
        # such a run it lints the commits since the newest release tag.
        run: |
          if [ -z "$BEFORE" ]; then
            linted=$(bun scripts/release-lint/main.ts)
            if [ -z "$linted" ] || ! git merge-base --is-ancestor "$linted" "$GITHUB_SHA"; then
              linted=$(git describe --tags --abbrev=0 --match 'v[0-9]*')
            fi
            if [ "$(git rev-parse "$linted^{commit}")" != "$GITHUB_SHA" ]; then
              bun x --bun commitlint --from "$linted" --to "$GITHUB_SHA" --verbose
            fi
          elif [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            bun x --bun commitlint --last --verbose
          elif git merge-base --is-ancestor "$BEFORE" "$GITHUB_SHA" 2>/dev/null; then
            bun x --bun commitlint --from "$BEFORE" --to "$GITHUB_SHA" --verbose
          elif ! git fetch --no-tags origin "$BEFORE"; then
            bun x --bun commitlint --last --verbose
          else
            for commit in $(git rev-list --reverse "$GITHUB_SHA" --not "$BEFORE" --tags='v[0-9]*'); do
              git log -1 --format=%B "$commit" | bun x --bun commitlint --verbose
            done
          fi

  # It waits for pack too, though only publish uses the packages, so a slow pack cannot let a newer run publish first.
  # A run that packs nothing, as plan found nothing to release, still runs it, which then tags nothing.
  release:
    needs: [plan, pack, check, commits]
    if: ${{ !cancelled() && !failure() && !inputs.tag }}
    concurrency:
      group: release-tag
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Only checked commits are released: when main moved on, the run of the newer push releases it all.
      - name: Check that main is still the checked commit
        id: head
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; fi
      # The tag is annotated, so it has a tagger. It prints nothing when there is nothing to release.
      - name: Tag the release
        id: cut
        if: steps.head.outputs.current == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag=$(bun run release --notes "$RUNNER_TEMP/notes.md" --features-release-rule)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Push the tag and publish the GitHub release
        id: push
        if: steps.cut.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.cut.outputs.tag }}
        run: |
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Trusted publishing: npm trusts this workflow file of this repository for every @protobase package, so there is no
  # npm token; npm 11.5.1 or newer exchanges the job's OIDC token and adds provenance, which Bun's publish cannot yet, so
  # npm publishes, under Node, the tarballs the pack job packed. A run that cut no release has no tag and publishes
  # nothing, and a tag other than the version the tarballs were stamped with fails before anything is uploaded.
  publish:
    needs: [release, pack]
    if: ${{ !cancelled() && needs.pack.result == 'success' && (inputs.tag || needs.release.outputs.tag != '') }}
    concurrency:
      group: release-publish
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || needs.release.outputs.tag }}
      # Node 24.22.1 bundles npm 11.19.1, at least the 11.5.1 trusted publishing needs: a newer Node must keep that.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: ${{ runner.temp }}/packages
      - name: Publish the packages
        env:
          NPM_CONFIG_PROVENANCE: 'true'
          TAG: ${{ inputs.tag || needs.release.outputs.tag }}
        run: node scripts/publish.mjs --from "$RUNNER_TEMP/packages" --tag "$TAG"

  # The images, on GitHub's registry at the release's version (see image.yml), built from the release's @protobase
  # packages as npm serves them: ghcr.io/prototeamhq/protobase, the serve runtime and the shell of @protobase/cli and
  # @protobase/ui, and ghcr.io/prototeamhq/protobase-dev, Bun and the presets, whose bun.lock files resolve the packages
  # from npm. Each build leg waits for npm to serve the packages, so a release without them on npm has no images.
  image:
    needs: [release, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    concurrency:
      group: release-image
      queue: max
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: protobase
      tag: ${{ inputs.tag || needs.release.outputs.tag }}

  image-dev:
    needs: [release, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    concurrency:
      group: release-image-dev
      queue: max
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: protobase-dev
      tag: ${{ inputs.tag || needs.release.outputs.tag }}

  # Our own repositories, listed in the PROTOBASE_BUMP_REPOS secret, each get a pull request that moves them to the
  # release: their protobase-bump workflow is started at its version once npm serves it, and the pull request merges
  # itself once its CI is green and stays open for a fix when it is red. No other job needs this one, so a bump that
  # cannot start never holds up the packages or the images.
  bump:
    needs: [release, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    concurrency:
      group: release-bump
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || needs.release.outputs.tag }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Stamp the tag's version into the packages
        env:
          TAG: ${{ inputs.tag || needs.release.outputs.tag }}
        run: bun scripts/stamp-version.mjs "$TAG"
      - name: Wait for npm to serve the @protobase packages
        run: bun scripts/wait-for-npm.mjs
      - name: Start the bump of each repository
        env:
          GH_TOKEN: ${{ secrets.PROTOBASE_BUMP_TOKEN }}
          PROTOBASE_BUMP_REPOS: ${{ secrets.PROTOBASE_BUMP_REPOS }}
          TAG: ${{ inputs.tag || needs.release.outputs.tag }}
        run: bun scripts/bump-repos/main.ts

  # Starts the release-speed report once every other job has ended, whatever their outcome: a run dispatched with
  # GITHUB_TOKEN, as the AI review's are, fires no workflow_run, so the report cannot wait for the release's completion
  # itself. It runs for releases of main only, a failed dispatch neither fails nor holds up the release, and the report
  # measures a release up to its last job before this one (scripts/release-speed/timings.ts).
  release-speed:
    needs: [plan, pack, check, commits, release, publish, image, image-dev, bump]
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      actions: write
    steps:
      - name: Start the release-speed report
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh workflow run release-speed.yml --ref main -f release_run="$RUN_ID"
