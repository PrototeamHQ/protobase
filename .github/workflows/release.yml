name: release

# Every push to main is released when it holds a fix, feature or breaking change: the checks pass, the pushed commits
# follow Conventional Commits, then scripts/release.mjs tags the pushed commit vx.y.z, without a commit to main, the
# tag is pushed with a GitHub release, and the packages are published to npm and the images to GitHub's registry at the
# tag's version, which scripts/stamp-version.mjs writes into the package.json files in the runner. Run by hand, it
# publishes the packages at an existing tag, skipping versions npm already has, and the images, to repeat a missed
# publish. See website/src/content/docs/reference/versioning.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: The release tag to publish to npm and GitHub's registry, e.g. v0.1.0
        required: true

# One release at a time; a run waiting behind another is replaced by the run of a newer push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    if: ${{ github.event_name == 'push' }}
    uses: ./.github/workflows/ci.yml

  commits:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Lint the pushed commits
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            bun x --bun commitlint --last --verbose
          else
            bun x --bun commitlint --from "$BEFORE" --to "$GITHUB_SHA" --verbose
          fi

  release:
    needs: [check, commits]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.push.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # Only checked commits are released: when main moved on, the run of the newer push releases it all.
      - name: Check that main is still the checked commit
        id: head
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; fi
      # The tag is annotated, so it has a tagger. It prints nothing when there is nothing to release.
      - name: Tag the release
        id: cut
        if: steps.head.outputs.current == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          tag=$(bun run release --notes "$RUNNER_TEMP/notes.md")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Push the tag and publish the GitHub release
        id: push
        if: steps.cut.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.cut.outputs.tag }}
        run: |
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Trusted publishing: npm trusts this workflow file of this repository for every @protobase package, so there is no
  # npm token; npm 11.5.1 or newer exchanges the job's OIDC token and adds provenance, which Bun's publish cannot yet, so
  # npm publishes under Node and Bun only builds and packs. A run that cut no release has no tag and publishes nothing.
  publish:
    needs: release
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.release.outputs.tag != '') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag || needs.release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Stamp the tag's version into the packages
        env:
          TAG: ${{ inputs.tag || needs.release.outputs.tag }}
        run: bun scripts/stamp-version.mjs "$TAG"
      - name: Publish the packages
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: node scripts/publish.mjs

  # The images, on GitHub's registry at the release's version (see image.yml), built from the release's @protobase
  # packages as npm serves them: ghcr.io/prototeamhq/protobase, the serve runtime and the shell of @protobase/cli and
  # @protobase/ui, and ghcr.io/prototeamhq/protobase-dev, Bun and the presets, whose bun.lock files resolve the packages
  # from npm. Both wait for publish, so a release without its packages on npm has no images.
  image:
    needs: [release, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: protobase
      tag: ${{ inputs.tag || needs.release.outputs.tag }}

  image-dev:
    needs: [release, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      image: protobase-dev
      tag: ${{ inputs.tag || needs.release.outputs.tag }}
