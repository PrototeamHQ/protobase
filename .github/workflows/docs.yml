name: docs

on:
  push:
    branches: [main]
  # A merge with the workflow's own token pushes without starting a workflow, so what merged it starts this one
  # (dispatch-after-merge in ai-review.yml and scripts/auto-merge-approvals/after-merge.ts).
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A merge into another branch dispatches there too, and only main deploys.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run docs:build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/website
          packageManager: bun
          command: pages deploy dist --project-name=protobase-docs --branch=production
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
