name: docs

on:
  push:
    branches: [main]
  # A merge the AI review makes with the workflow's own token pushes without starting a workflow, so the review sends
  # this event once it merged (protobase-community/.github's .github/ai-review/announce.ts). It always runs on main, and
  # its payload names the branch the merge went into.
  repository_dispatch:
    types: [pull_request_merged]
  workflow_dispatch:

concurrency:
  group: docs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'repository_dispatch' || github.event.client_payload.base == 'main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run docs:build
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: docs/website
          packageManager: bun
          command: pages deploy dist --project-name=protobase-docs --branch=production
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
