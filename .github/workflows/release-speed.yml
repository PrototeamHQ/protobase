name: release-speed

# How fast releases are tested and built against their targets (scripts/release-speed/config.json): daily, after each
# release run of main and by hand, the report goes to this run's job summary. A release run's last job dispatches it
# with that run's id, since a release the AI review dispatches with GITHUB_TOKEN fires no workflow_run, and the report
# waits for that run to complete so it counts it. It is a workflow of its own that only reads the Actions API, so it
# cannot hold up or fail a release, and a target that is not met does not fail it.
on:
  schedule:
    - cron: '23 6 * * *'
  workflow_dispatch:
    inputs:
      release_run:
        description: The id of a release run to wait for before measuring, up to 10 minutes. Empty measures at once.
        required: false
        default: ''

permissions:
  actions: read
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Node's and Bun's built-ins and the gh CLI only, so no install.
      - name: Report the release speed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN: ${{ inputs.release_run }}
        run: bun scripts/release-speed/main.ts
