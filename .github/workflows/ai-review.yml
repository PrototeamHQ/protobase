# AI review of every pull request; see protobase-community/.github's ai-pr-review workflow. A review that finds no
# issues also merges the pull request once every other check passed, except a pull request with the do-not-merge
# label. A merge with GITHUB_TOKEN starts no workflow, so the review then starts release.yml with workflow_dispatch,
# which releases main's head as a push would.
# pull_request_target runs this file from the base branch and never checks out the pull request.
name: ai-review

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] nothing from the pull request runs
    # The review adds ai-approved with GITHUB_TOKEN, and a label added with GITHUB_TOKEN starts no workflow.
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  # The repository's CI workflows, by name: each run that finishes tries the merge again. Never list ai-review itself.
  workflow_run:
    workflows: [ci, docs, image, pr-title, release-speed]
    types: [completed]
  # Another app's check suite or commit status that finishes tries the merge again too, as its completion starts no
  # workflow_run. A pending status runs no job.
  # status takes no activity types, so every status starts a run; the job's own condition skips a pending one.
  check_suite:
    types: [completed]
  status:
  # An approval or a dismissed review can lift the change request that blocked the merge; it runs this file from the
  # pull request's merge commit, so the merge job below takes it and the review job adds no check of its name for it.
  pull_request_review:
    types: [submitted, dismissed]

# Merging a pull request takes contents: write: https://docs.github.com/en/rest/authentication/permissions-required-for-github-apps#repository-permissions-for-contents
# Starting release.yml after a merge takes actions: write.
permissions:
  actions: write
  checks: read
  contents: write
  pull-requests: write
  statuses: read

jobs:
  review:
    if: github.event_name != 'pull_request_review'
    uses: protobase-community/.github/.github/workflows/ai-pr-review.yml@main # zizmor: ignore[unpinned-uses] main is the reviewed version
    with:
      auto-merge: true
      framework-generic: true
      dispatch-after-merge: release.yml
    secrets:
      SCW_PR_REVIEW_SECRET_KEY: ${{ secrets.SCW_PR_REVIEW_SECRET_KEY }}

  # Only tries the merge again, under a name of its own, so the review event leaves the review's check alone.
  merge:
    if: github.event_name == 'pull_request_review'
    uses: protobase-community/.github/.github/workflows/ai-pr-review.yml@main # zizmor: ignore[unpinned-uses] main is the reviewed version
    with:
      auto-merge: true
      framework-generic: true
      dispatch-after-merge: release.yml
    secrets:
      SCW_PR_REVIEW_SECRET_KEY: ${{ secrets.SCW_PR_REVIEW_SECRET_KEY }}
