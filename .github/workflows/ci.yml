name: ci

on:
  pull_request:
  push:
    # fm/** are the task branches that workers push to have the checks run on CHECK_RUNNER's runner.
    branches: [production, 'fm/**']
  # The release workflow runs these checks before it releases, with the Postgres suite in full.
  workflow_call:
    inputs:
      postgres:
        description: Run the Postgres suite whatever changed
        type: boolean
        default: false
  # Run by hand, every test and step runs, as on a pull request.
  workflow_dispatch:
  # Weekly, the Postgres suite and the snapshot recording alone, to catch a moved postgres:18 tag when nothing in the
  # repository changed.
  schedule:
    - cron: '17 4 * * 1'

jobs:
  # The typecheck, the unit and snapshot tests, the dependency boundaries and the packing: the checks that need no
  # Postgres. `integration` runs the rest of `bun run check` beside it.
  check:
    if: github.event_name != 'schedule'
    # A second push of an fm/** branch replaces the run still queued or running for it, so a stale run holds no runner.
    # Every other run gets a group of its own, so main, pull requests and the release workflow's call are never cancelled.
    concurrency:
      group: check-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fm/') && github.ref || github.run_id }}
      cancel-in-progress: true
    # Pushes to main and to fm/** branches run on the runner the CHECK_RUNNER variable names, when it is set; pull
    # requests, which forks can open, always run on GitHub's runners. See CONTRIBUTING.md.
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/')) && vars.CHECK_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The history and tags, to find what a push changed.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # A branch's commits land on main as they are, where the release workflow refuses any that commitlint does, so they
      # are linted here first: a pull request's from its base, a task branch's from where it forked from main. A branch
      # whose head main already holds has no commits of its own, and commitlint refuses a range from a commit to itself.
      - name: Lint the branch's commits
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fm/'))
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          from="${BASE:-$(git merge-base origin/main "$HEAD")}"
          if [ "$(git rev-parse "$from")" = "$(git rev-parse "$HEAD")" ]; then exit 0; fi
          bun x --bun commitlint --from "$from" --to "$HEAD" --verbose
      # bunfig.toml has `bun run` put a node that is Bun first on PATH, so the checks run on Bun. Bun skips that without a
      # word when another user owns its /tmp/bun-node-* directory, as on a shared server, and they would run on Node.
      - &bun-node
        run: bun run sh -c 'node -e "process.versions.bun || (console.error(\"bun run starts Node, not Bun\"), process.exit(1))"'
      # The protobase skill's references are generated from the docs, not committed: this fails when a page cannot be made
      # Markdown or the hand-written SKILL.md and the pages do not point at each other.
      - run: bun run docs:skill --check
      # The features pages keep their grammar, link real headings and cover every reference page (CONTRIBUTING.md,
      # Features and docs). Its --release-rule, that a release with a feature changes the docs, is not on yet.
      - run: bun run features:check
      # A push to main, which the release workflow checks, or to an fm/** branch runs only the tests and steps its
      # changes affect (scripts/affected-tests.mjs, see CONTRIBUTING.md): on main the changes since the last release, on
      # a branch those since it left main. Without CHECK_BASE, as on a pull request or a run by hand, everything runs.
      - &check-base
        name: Find the commit the push's changes count from
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/'))
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
            if [ -z "$base" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then base=$BEFORE; fi
          else
            base=$(git merge-base origin/main HEAD)
          fi
          echo "CHECK_BASE=$base" >> "$GITHUB_ENV"
      - run: bun run check:unit
      - &setup-node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Every package built, declarations included, and packed as the release workflow publishes it, so a package that
      # cannot build or be packed fails before a release is cut. The tests run on the sources, so nothing builds earlier.
      # The CLI's build writes the protobase skill's references, which are not committed, so its tarball must carry them.
      - run: |
          set -o pipefail
          node scripts/publish.mjs --pack | tee "$RUNNER_TEMP/pack.log"
          tar tzf "$(grep -o '[^ ]*protobase-cli-[^ ]*\.tgz' "$RUNNER_TEMP/pack.log")" > "$RUNNER_TEMP/cli-files.txt"
          grep -qx 'package/skills/protobase/references/reference/access.md' "$RUNNER_TEMP/cli-files.txt"

  # The integration, smoke and end-to-end tests, on Postgres, beside check.
  integration:
    if: github.event_name != 'schedule'
    concurrency:
      group: integration-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fm/') && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/')) && vars.CHECK_RUNNER || 'ubuntu-latest' }}
    # The integration tests' Postgres, as docker-compose.yml runs it locally: same image and user. Its host port is a free
    # one Docker picks, not docker-compose.yml's fixed one, so each job's database is its own and one left behind by an
    # earlier job cannot hold the port this one needs.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: protobase
          POSTGRES_PASSWORD: protobase
          POSTGRES_DB: protobase
        ports:
          - 5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U protobase -d protobase"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # The tests reach the server on the port the service was given (scripts/test-db/templates.ts).
      - name: Point the tests at the service's Postgres
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: echo "TEST_POSTGRES_URL=postgres://protobase:protobase@localhost:$POSTGRES_PORT/postgres" >> "$GITHUB_ENV"
      # A throwaway database needs no durability. Each `drop database` the tests' clones end with forces a checkpoint, and
      # on a runner that shares its disk those queue behind each other until hooks time out; without fsync they are quick.
      - name: Turn off the service Postgres' durability
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U protobase -d protobase -v ON_ERROR_STOP=1
          -c "alter system set fsync = off" -c "alter system set synchronous_commit = off"
          -c "alter system set full_page_writes = off" -c "select pg_reload_conf()"
      - *bun-node
      # The template databases each integration run clones; with CI set, a missing one fails the run instead of skipping.
      - run: bun run test:db
      # A self-hosted runner has no root to install Chromium's system packages, so its server provides them.
      - run: bun x --bun playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - *check-base
      - run: bun run check:integration
      # check:integration ran the smoke test on Bun; the CLI is supported on Node as well, so it runs there too.
      - *setup-node
      - run: node --run test:smoke

  # Storybook built, its play tests and layout snapshots, and the documentation site built and checked, as two jobs
  # beside check: a push runs them when its changes reach them (scripts/affected-site.mjs); a pull request and a run by
  # hand always do. The play tests set the check phase's length, so storybook runs as 2 legs that each build Storybook
  # and play every other story; the first also takes the layout snapshots.
  storybook:
    if: github.event_name != 'schedule'
    name: storybook ${{ matrix.shard }}/2
    strategy:
      matrix:
        shard: [1, 2]
    concurrency:
      group: storybook-${{ matrix.shard }}-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fm/') && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/')) && vars.CHECK_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      # Before the site's gate, which reads the module graph through Vitest.
      - run: bun install --frozen-lockfile
      - *check-base
      - &affected-site
        name: Find whether the changes reach the site or Storybook
        id: site
        run: bun scripts/affected-site.mjs
      - if: steps.site.outputs.run == 'true'
        run: bun x --bun playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - if: steps.site.outputs.run == 'true'
        run: bun run build-storybook
      - if: steps.site.outputs.run == 'true'
        run: bun scripts/play-tests.mjs --shard ${{ matrix.shard }}/2
      - if: steps.site.outputs.run == 'true' && matrix.shard == 1
        run: bun scripts/dom-snapshots.mjs --no-screenshots

  docs:
    if: github.event_name != 'schedule'
    concurrency:
      group: docs-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fm/') && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/')) && vars.CHECK_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - *check-base
      - *affected-site
      - if: steps.site.outputs.run == 'true'
        run: bun x --bun playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      # The site carries the built Storybook under /storybook, so docs:build builds it here as well.
      - if: steps.site.outputs.run == 'true'
        run: bun run docs:build
      - if: steps.site.outputs.run == 'true'
        run: bun run docs:check

  # The real-Postgres tests beyond what every push needs (`bun run test:postgres`): the ERP at medium scale and the
  # planner's statistics on it, and the jobs and event delivery through PgBouncer. A push runs it when its snapshot
  # recordings differ from those at CHECK_BASE, or when it changes what recordings cannot show (`postgresSuite`,
  # scripts/affected-postgres.mjs); a pull request, a run by hand and the weekly run always do. It runs after `record`,
  # whose answer it needs, whatever `record` found. A release runs it in full as `postgres-full` instead.
  postgres:
    needs: record
    if: ${{ !cancelled() && !inputs.postgres }}
    concurrency:
      group: postgres-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fm/') && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/')) && vars.CHECK_RUNNER || 'ubuntu-latest' }}
    services: &postgres-services
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: protobase
          POSTGRES_PASSWORD: protobase
          POSTGRES_DB: protobase
        ports:
          - 5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U protobase -d protobase"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - *check-base
      - name: Find whether the changes reach the Postgres suite
        id: postgres
        env:
          POSTGRES_FULL: 'false'
          RECORDINGS: ${{ needs.record.outputs.recordings }}
        run: bun scripts/affected-postgres.mjs
      - &postgres-install
        if: steps.postgres.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - &postgres-url
        if: steps.postgres.outputs.run == 'true'
        name: Point the tests at the service's Postgres
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: echo "TEST_POSTGRES_URL=postgres://protobase:protobase@localhost:$POSTGRES_PORT/postgres" >> "$GITHUB_ENV"
      # As in check: each `drop database` forces a checkpoint, here behind the medium template's writes; no fsync keeps it quick.
      - &postgres-durability
        if: steps.postgres.outputs.run == 'true'
        name: Turn off the service Postgres' durability
        run: >-
          docker exec ${{ job.services.postgres.id }} psql -U protobase -d protobase -v ON_ERROR_STOP=1
          -c "alter system set fsync = off" -c "alter system set synchronous_commit = off"
          -c "alter system set full_page_writes = off" -c "select pg_reload_conf()"
      # The cloud's pooler in front of the same server, as docker-compose.yml runs it, tracking statement_timeout as the
      # cloud's does, which the image has no variable for, with protobase as its admin, so the tests can pause a database
      # on it as the cloud scales one to zero. It is started here rather than as a service so it reaches
      # Postgres by address: on the shared self-hosted runner, looking up the service name now and then stalls while
      # other jobs create and remove their networks, and the PgBouncer tests then find no pooler.
      - &pgbouncer
        if: steps.postgres.outputs.run == 'true'
        name: Start PgBouncer in front of that Postgres and point the tests at it
        env:
          POSTGRES_ID: ${{ job.services.postgres.id }}
          NETWORK: ${{ job.services.postgres.network }}
          PGBOUNCER: pgbouncer-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          address=$(docker inspect --format "{{(index .NetworkSettings.Networks \"$NETWORK\").IPAddress}}" "$POSTGRES_ID")
          docker run --detach --rm --name "$PGBOUNCER" --network "$NETWORK" --publish 5432 \
            -e DB_HOST="$address" -e DB_USER=protobase -e DB_PASSWORD=protobase -e AUTH_TYPE=scram-sha-256 \
            -e POOL_MODE=transaction -e MAX_PREPARED_STATEMENTS=200 -e MAX_USER_CONNECTIONS=3 \
            -e ADMIN_USERS=protobase \
            edoburu/pgbouncer:v1.26.0-p0 \
            sh -c "sed -i '/^track_extra_parameters/d; /^\[pgbouncer\]/a track_extra_parameters = statement_timeout' /etc/pgbouncer/pgbouncer.ini && exec pgbouncer /etc/pgbouncer/pgbouncer.ini"
          port=$(docker port "$PGBOUNCER" 5432/tcp | head -n1 | sed 's/.*://')
          echo "TEST_PGBOUNCER_URL=postgres://protobase:protobase@localhost:$port/postgres" >> "$GITHUB_ENV"
      - &postgres-templates
        if: steps.postgres.outputs.run == 'true'
        run: bun run test:db postgres
      - &postgres-suite
        if: steps.postgres.outputs.run == 'true'
        run: bun run test:postgres
      - &pgbouncer-remove
        if: always() && steps.postgres.outputs.run == 'true'
        name: Remove PgBouncer
        env:
          PGBOUNCER: pgbouncer-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$PGBOUNCER" || true

  # The Postgres suite in full, as the last fail-safe before a release (the release workflow's `postgres: true`), with
  # the same steps as `postgres`. It needs no answer from `record`, so it starts beside the other checks.
  postgres-full:
    if: ${{ inputs.postgres }}
    concurrency:
      group: postgres-full-${{ github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/')) && vars.CHECK_RUNNER || 'ubuntu-latest' }}
    services: *postgres-services
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Find whether the changes reach the Postgres suite
        id: postgres
        env:
          POSTGRES_FULL: 'true'
        run: bun scripts/affected-postgres.mjs
      - *postgres-install
      - *postgres-url
      - *postgres-durability
      - *pgbouncer
      - *postgres-templates
      - *postgres-suite
      - *pgbouncer-remove

  # The snapshot tests' recordings (`bun run test:record`): every snapshot test run again on real Postgres, its SQL and
  # answers written to its `*.sql.json`. A recording that differs from the committed one means Postgres now answers the
  # same queries differently (a schema, fixture or Postgres change), which replay alone cannot see, and fails the job;
  # the new recordings are uploaded to commit. A push runs it when it changes what the recordings are made from
  # (scripts/affected-snapshots.mjs); a pull request, a run by hand and the weekly run, for a moved postgres:18, always do.
  # It tells the Postgres job whether the recordings changed. It runs beside check, on a runner of its own, and in a
  # release beside the full Postgres suite, which still waits for it before the release is cut.
  record:
    outputs:
      recordings: ${{ steps.recordings.outputs.recordings }}
    concurrency:
      group: record-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fm/') && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/')) && vars.CHECK_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: protobase
          POSTGRES_PASSWORD: protobase
          POSTGRES_DB: protobase
        ports:
          - 5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U protobase -d protobase"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - *check-base
      - name: Find whether the changes reach the snapshot recordings
        id: snapshots
        run: bun scripts/affected-snapshots.mjs
      - if: steps.snapshots.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - if: steps.snapshots.outputs.run == 'true'
        name: Point the recording at the service's Postgres
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: echo "TEST_POSTGRES_URL=postgres://protobase:protobase@localhost:$POSTGRES_PORT/postgres" >> "$GITHUB_ENV"
      # Supabase's Postgres image, for the Supabase import's snapshot tests, initialised as a dedicated Protobase Cloud
      # instance is: without Supabase's own init, which an empty /docker-entrypoint-initdb.d leaves out, and with
      # test-support/supabase-postgres/ run on it once it is up, as docker-compose.yml mounts it. The empty directory is a
      # bind mount, not a --tmpfs: podman copies the image's init scripts into a tmpfs.
      - if: steps.snapshots.outputs.run == 'true'
        name: Start Supabase's Postgres and point the recording at it
        env:
          SUPABASE_POSTGRES: supabase-postgres-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/$SUPABASE_POSTGRES-initdb"
          docker run --detach --rm --name "$SUPABASE_POSTGRES" --publish 5432 \
            --volume "$RUNNER_TEMP/$SUPABASE_POSTGRES-initdb:/docker-entrypoint-initdb.d:ro" \
            -e POSTGRES_PASSWORD=protobase supabase/postgres:17.11.0.006
          until docker exec "$SUPABASE_POSTGRES" pg_isready -U supabase_admin -d postgres -h 127.0.0.1 -q; do sleep 2; done
          for file in test-support/supabase-postgres/*.sql; do
            docker exec -i "$SUPABASE_POSTGRES" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q < "$file"
          done
          port=$(docker port "$SUPABASE_POSTGRES" 5432/tcp | head -n1 | sed 's/.*://')
          echo "TEST_SUPABASE_POSTGRES_URL=postgres://supabase_admin:protobase@localhost:$port/postgres" >> "$GITHUB_ENV"
      - if: steps.snapshots.outputs.run == 'true'
        run: bun run test:record
      - if: always() && steps.snapshots.outputs.run == 'true'
        name: Remove Supabase's Postgres
        env:
          SUPABASE_POSTGRES: supabase-postgres-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$SUPABASE_POSTGRES" || true
      # For the Postgres job, which skips its suite when no recording differs from those at CHECK_BASE.
      - name: Find whether the recordings differ from those the push's changes count from
        id: recordings
        run: bun scripts/affected-recordings.mjs
      # New recordings count as changes too.
      - if: always() && steps.snapshots.outputs.run == 'true'
        name: Find whether a recording differs from the committed one
        id: committed
        run: |
          git add --intent-to-add -- '*.sql.json'
          if git diff --quiet -- '*.sql.json'; then echo differ=false; else echo differ=true; fi >> "$GITHUB_OUTPUT"
      # The new recordings, to commit, only when there are any.
      - if: always() && steps.committed.outputs.differ == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sql-snapshots
          path: |
            **/*.sql.json
            !**/node_modules/**
      - if: steps.committed.outputs.differ == 'true'
        name: Fail when a recording differs from the committed one
        run: git diff --stat -- '*.sql.json' && exit 1

  # A Supabase project moved by the real `protobase import supabase` and served to supabase-js
  # (tests/supabase-move/client/): from Supabase's Postgres image, started as in record, into the service's Postgres.
  # pg_dump and psql come from Docker's postgres:18 (tests/supabase-move/client/pg-tools/). A push runs it when its
  # changes reach the test (scripts/affected-tests.mjs); a pull request and a run by hand always do.
  supabase-move:
    if: github.event_name != 'schedule'
    concurrency:
      group: supabase-move-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fm/') && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/')) && vars.CHECK_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: protobase
          POSTGRES_PASSWORD: protobase
          POSTGRES_DB: protobase
        ports:
          - 5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U protobase -d protobase"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - *check-base
      - name: Point the test at the service's Postgres
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: echo "TEST_POSTGRES_URL=postgres://protobase:protobase@localhost:$POSTGRES_PORT/postgres" >> "$GITHUB_ENV"
      - name: Start Supabase's Postgres and point the test at it
        env:
          SUPABASE_POSTGRES: supabase-move-postgres-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          mkdir -p "$RUNNER_TEMP/$SUPABASE_POSTGRES-initdb"
          docker run --detach --rm --name "$SUPABASE_POSTGRES" --publish 5432 \
            --volume "$RUNNER_TEMP/$SUPABASE_POSTGRES-initdb:/docker-entrypoint-initdb.d:ro" \
            -e POSTGRES_PASSWORD=protobase supabase/postgres:17.11.0.006
          until docker exec "$SUPABASE_POSTGRES" pg_isready -U supabase_admin -d postgres -h 127.0.0.1 -q; do sleep 2; done
          for file in test-support/supabase-postgres/*.sql; do
            docker exec -i "$SUPABASE_POSTGRES" psql -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -q < "$file"
          done
          port=$(docker port "$SUPABASE_POSTGRES" 5432/tcp | head -n1 | sed 's/.*://')
          echo "TEST_SUPABASE_POSTGRES_URL=postgres://supabase_admin:protobase@localhost:$port/postgres" >> "$GITHUB_ENV"
      - run: bun scripts/affected-tests.mjs --project supabase-move
      - if: always()
        name: Remove Supabase's Postgres
        env:
          SUPABASE_POSTGRES: supabase-move-postgres-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force "$SUPABASE_POSTGRES" || true

  # A project made by `npm create protobase` on a Supabase database it shares with Supabase Auth: Supabase's Postgres
  # image with its own init, so `auth` is owned as on a Supabase project, and Supabase Auth migrating and serving it
  # (tests/supabase-auth/stack.sh). A push runs it when its changes reach the test (scripts/affected-tests.mjs); a pull
  # request and a run by hand always do.
  supabase-auth:
    if: github.event_name != 'schedule'
    concurrency:
      group: supabase-auth-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fm/') && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/')) && vars.CHECK_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - *check-base
      - name: Start Supabase's Postgres and Supabase Auth, and point the test at them
        run: tests/supabase-auth/stack.sh start "supabase-auth-${{ github.run_id }}-${{ github.run_attempt }}" >> "$GITHUB_ENV"
      - run: bun scripts/affected-tests.mjs --project supabase-auth
      - if: always()
        name: Remove Supabase's Postgres and Supabase Auth
        run: tests/supabase-auth/stack.sh stop "supabase-auth-${{ github.run_id }}-${{ github.run_attempt }}"
