name: ci

on:
  pull_request:
  push:
    # fm/** are the task branches that workers push to have the checks run on CHECK_RUNNER's runner.
    branches: [production, 'fm/**']
  # The release workflow runs these checks before it releases.
  workflow_call:
  # Run by hand, every test and step runs, as on a pull request.
  workflow_dispatch:
  # Weekly, the Postgres suite alone, to catch a moved postgres:18 tag when nothing in the repository changed.
  schedule:
    - cron: '17 4 * * 1'

jobs:
  check:
    if: github.event_name != 'schedule'
    # A second push of an fm/** branch replaces the run still queued or running for it, since the single runner queues.
    # Every other run gets a group of its own, so main, pull requests and the release workflow's call are never cancelled.
    concurrency:
      group: ci-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fm/') && github.ref || github.run_id }}
      cancel-in-progress: true
    # Pushes to main and to fm/** branches run on the runner the CHECK_RUNNER variable names, when it is set; pull
    # requests, which forks can open, always run on GitHub's runners. See CONTRIBUTING.md.
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/')) && vars.CHECK_RUNNER || 'ubuntu-latest' }}
    # The integration tests' Postgres, as docker-compose.yml runs it locally: same image and user. Its host port is a free
    # one Docker picks, not docker-compose.yml's fixed one, so each job's database is its own and one left behind by an
    # earlier job cannot hold the port this one needs.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: protobase
          POSTGRES_PASSWORD: protobase
          POSTGRES_DB: protobase
        ports:
          - 5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U protobase -d protobase"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          # The history and tags, to find what a push changed.
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # The tests reach the server on the port the service was given (scripts/test-db/templates.ts).
      - name: Point the tests at the service's Postgres
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: echo "TEST_POSTGRES_URL=postgres://protobase:protobase@localhost:$POSTGRES_PORT/postgres" >> "$GITHUB_ENV"
      # bunfig.toml has `bun run` put a node that is Bun first on PATH, so the checks run on Bun. Bun skips that without a
      # word when another user owns its /tmp/bun-node-* directory, as on a shared server, and they would run on Node.
      - run: bun run sh -c 'node -e "process.versions.bun || (console.error(\"bun run starts Node, not Bun\"), process.exit(1))"'
      # The protobase skill is generated from the docs and served by the site: it fails here when it falls behind them.
      - run: bun run docs:skill --check
      # The template databases each integration run clones; with CI set, a missing one fails the run instead of skipping.
      - run: bun run test:db
      # A self-hosted runner has no root to install Chromium's system packages, so its server provides them.
      - run: bun x --bun playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      # A push to main, which the release workflow checks, or to an fm/** branch runs only the tests and steps its
      # changes affect (scripts/affected-tests.mjs, see CONTRIBUTING.md): on main the changes since the last release, on
      # a branch those since it left main. Without CHECK_BASE, as on a pull request or a run by hand, everything runs.
      - &check-base
        name: Find the commit the push's changes count from
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/'))
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" = refs/heads/main ]; then
            base=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
            if [ -z "$base" ] && [ "$BEFORE" != 0000000000000000000000000000000000000000 ]; then base=$BEFORE; fi
          else
            base=$(git merge-base origin/main HEAD)
          fi
          echo "CHECK_BASE=$base" >> "$GITHUB_ENV"
      - run: bun run check
      # check ran the smoke test on Bun; the CLI is supported on Node as well, so it runs there too.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node --run test:smoke
      # Every package built, declarations included, and packed as the release workflow publishes it, so a package that
      # cannot build or be packed fails before a release is cut. The tests run on the sources, so nothing builds earlier.
      - run: node scripts/publish.mjs --pack
      - name: Find whether the changes reach the site or Storybook
        id: site
        run: bun scripts/affected-site.mjs
      - if: steps.site.outputs.run == 'true'
        run: bun run docs:build
      - if: steps.site.outputs.run == 'true'
        run: bun scripts/play-tests.mjs
      - if: steps.site.outputs.run == 'true'
        run: bun scripts/dom-snapshots.mjs --no-screenshots
      - if: steps.site.outputs.run == 'true'
        run: bun run docs:check

  # The real-Postgres tests beyond what every push needs (`bun run test:postgres`): the ERP at medium scale and the
  # planner's statistics on it, and the jobs and event delivery through PgBouncer. A push runs it when it changes SQL or
  # the Postgres setup (scripts/affected-postgres.mjs); a pull request, a run by hand and the weekly run always do.
  postgres:
    concurrency:
      group: postgres-${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/fm/') && github.ref || github.run_id }}
      cancel-in-progress: true
    runs-on: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/fm/')) && vars.CHECK_RUNNER || 'ubuntu-latest' }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: protobase
          POSTGRES_PASSWORD: protobase
          POSTGRES_DB: protobase
        ports:
          - 5432
        options: >-
          --shm-size 1g
          --health-cmd "pg_isready -U protobase -d protobase"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
      # The cloud's pooler in front of the same server, as docker-compose.yml runs it.
      pgbouncer:
        image: edoburu/pgbouncer:v1.26.0-p0
        env:
          DB_HOST: postgres
          DB_USER: protobase
          DB_PASSWORD: protobase
          AUTH_TYPE: scram-sha-256
          POOL_MODE: transaction
          MAX_PREPARED_STATEMENTS: 200
          MAX_USER_CONNECTIONS: 3
        ports:
          - 5432
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - *check-base
      - name: Find whether the changes reach the Postgres suite
        id: postgres
        run: bun scripts/affected-postgres.mjs
      - if: steps.postgres.outputs.run == 'true'
        run: bun install --frozen-lockfile
      - if: steps.postgres.outputs.run == 'true'
        name: Point the tests at the services' Postgres and PgBouncer
        env:
          POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          PGBOUNCER_PORT: ${{ job.services.pgbouncer.ports['5432'] }}
        run: |
          echo "TEST_POSTGRES_URL=postgres://protobase:protobase@localhost:$POSTGRES_PORT/postgres" >> "$GITHUB_ENV"
          echo "TEST_PGBOUNCER_URL=postgres://protobase:protobase@localhost:$PGBOUNCER_PORT/postgres" >> "$GITHUB_ENV"
      - if: steps.postgres.outputs.run == 'true'
        run: bun run test:db postgres
      - if: steps.postgres.outputs.run == 'true'
        run: bun run test:postgres
