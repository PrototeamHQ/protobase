# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Inherits PrototeamHQ/coderabbit/.coderabbit.yaml, which reads CONTRIBUTING.md, and adds the framework checks and
# the files CONTRIBUTING.md links for how CI and the snapshot tests work.
inheritance: true
knowledge_base:
  code_guidelines:
    filePatterns:
      - files: "protobase-community/.github:.github/ai-review/prompts/framework-generic.md"
        applyTo: "packages/**"
      - files: "docs/ci.md"
        applyTo: ".github/**,scripts/**,package.json,vitest.config.ts"
      - files: "docs/snapshot-tests.md"
        applyTo: "**/*.test.ts,**/*.sql.json,test-support/**,scripts/test-db/**"
reviews:
  # Generated SQL recordings: the check job's replay proves them, and one large recording made the review skip a whole PR.
  path_filters:
    - "!**/*.sql.json"
  auto_review:
    # protobase merges on CodeRabbit's approval of each head and cannot call the private AI review.
    auto_incremental_review: true
    auto_pause_after_reviewed_commits: 0
