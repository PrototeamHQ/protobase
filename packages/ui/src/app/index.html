<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- No brand's name before the app's loads: the sign-in screens and the app put the app's own name here. -->
    <title></title>
    <!-- Makes the app installable, named for the app: the server answers it, as it alone knows the name. -->
    <link rel="manifest" href="/api/manifest.webmanifest" />
    <!-- The theme before the first paint, so a dark page never flashes light: as theme/theme-preference.ts resolves it, the choice stored in this browser, else the system's. -->
    <script>
      var stored = null
      try {
        stored = localStorage.getItem('protobase:theme')
      } catch (error) {
        if (!(error instanceof DOMException)) throw error
      }
      document.documentElement.dataset.theme = stored === 'light' || stored === 'dark' ? stored : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
    </script>
    <!--
      The start screen, before any stylesheet or script of the app loads: the theme's background, and after a moment a
      spinner, until the app removes it (start-screen.ts) once it has drawn its first page. The colours are the theme's,
      a project's protobase.theme.css included, else those of tokens.css, which index-html.test.ts keeps them equal to.
    -->
    <style>
      html,
      #pb-start {
        background: var(--background, #ffffff);
        color: var(--muted-foreground, #71717a);
      }
      html[data-theme='dark'],
      [data-theme='dark'] #pb-start {
        background: var(--background, #0f0f11);
        color: var(--muted-foreground, #a1a1aa);
        color-scheme: dark;
      }
      /* Above all the app draws under it while it starts */
      #pb-start {
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /* The app's loading screens wait as long before they show their spinner */
      #pb-start svg {
        animation:
          pb-start-reveal 1ms 180ms backwards,
          pb-start-spin 1s linear infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        #pb-start svg {
          animation: pb-start-reveal 1ms 180ms backwards;
        }
      }
      @keyframes pb-start-reveal {
        from {
          visibility: hidden;
        }
      }
      @keyframes pb-start-spin {
        to {
          transform: rotate(360deg);
        }
      }
      /* A start that failed: index.html's own words, as the app's translations never loaded */
      #pb-start [role='alert'] {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        max-width: 20rem;
        padding: 16px;
        text-align: center;
        font: 14px/1.5 system-ui, sans-serif;
      }
      #pb-start [role='alert'][hidden] {
        display: none;
      }
      #pb-start button {
        padding: 6px 12px;
        border: 1px solid currentColor;
        border-radius: 6px;
        background: transparent;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <!-- As tall as the screen shows, browser toolbars aside, so a page that fills it, such as a map, keeps the bottom bar in view. The page reaches under the status bar and the home indicator, which the shell's bars keep clear of; the sides keep clear of the notch. -->
    <div id="root" class="h-dvh" style="padding-left: var(--pb-safe-left); padding-right: var(--pb-safe-right)"></div>
    <div id="pb-start" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56" /></svg>
      <div role="alert" hidden>
        <p style="margin: 0">The app did not load. Check your connection, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </div>
    <!--
      A start that fails says so in place of the spinner: the app's script did not load, the app threw before it drew its
      first page, or it has not drawn it after 15 seconds. The app's hand-off (start-screen.ts) ends the watch, and still
      takes the screen away when a slow start draws its first page after all.
    -->
    <script>
      ;(function () {
        var start = document.getElementById('pb-start')
        var stop = function () {
          clearTimeout(watchdog)
          window.removeEventListener('error', failed, true)
          window.removeEventListener('unhandledrejection', failed)
          start.removeEventListener('pb-start-hand-off', stop)
        }
        var failed = function (event) {
          // A stylesheet or an image that does not load leaves the app to start
          if (event && event.type === 'error' && event.target !== window && event.target.tagName !== 'SCRIPT') return
          stop()
          start.removeAttribute('aria-hidden')
          start.querySelector('svg').remove()
          start.querySelector('[role="alert"]').hidden = false
        }
        var watchdog = setTimeout(failed, 15000)
        // A script's load error reaches the window only on the way down
        window.addEventListener('error', failed, true)
        window.addEventListener('unhandledrejection', failed)
        start.addEventListener('pb-start-hand-off', stop)
      })()
    </script>
    <script type="module" src="./main"></script>
  </body>
</html>
